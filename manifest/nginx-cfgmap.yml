apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: app
data:
  nginx.conf: |
    events {}
    http {
        upstream go_backend {
            server go-app-internal-svc:8080;
        }
        server {
            listen 80;
            server_name localhost;
            
            # Điều hướng traffic đến Go App
            location / {
                proxy_pass http://go_backend;
            }

            # Trang monitoring số lượng request
            location /stub_status {
                stub_status on;
                allow 127.0.0.1; # Trong thực tế nên giới hạn IP
                access_log off;
            }
        }
    }

