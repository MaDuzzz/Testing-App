apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lb
  template:
    metadata:
      labels:
        app: nginx-lb
      annotations:
        # Nếu dùng Prometheus Operator, các dòng này giúp tự động nhận diện
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
          - "-nginx.scrape-uri=http://localhost:80/stub_status"
        ports:
        - containerPort: 9113      
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: app
  labels:
    app: nginx-lb
spec:
  type: NodePort
  selector:
    app: nginx-lb
  ports:
    - name: http  
      port: 80
      targetPort: 80
      nodePort: 32000 # Bạn truy cập qua IP_NODE:32000
    - name: metrics
      port: 9113
      targetPort: 9113

